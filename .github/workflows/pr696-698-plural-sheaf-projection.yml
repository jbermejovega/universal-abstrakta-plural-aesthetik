name: PR 696-698 plural sheaf projection

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr696-698-plural-sheaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run focused Vitest suite
        run: npx vitest run tests/pr696-698-plural-sheaf-projection.test.ts

      - name: Verify exact terminal end line
        run: |
          PROJECTION=projections/SYNTHGOTHHUB_PR696_698_PLURAL_SHEAF_PROJECTION_V1.sigil
          tail -n 1 "$PROJECTION" | grep -Fx \
            'end SYNTHGOTHHUB_PR696_698_PLURAL_SHEAF_PROJECTION_V1'
          test "$(grep -Fxc 'end SYNTHGOTHHUB_PR696_698_PLURAL_SHEAF_PROJECTION_V1' "$PROJECTION")" = 1

      - name: Enforce inert projection boundary
        run: |
          ! grep -REn \
            'git push|gh pr merge|workflow_dispatch:|pull_request:|push:|child_process|exec\(|eval\(' \
            src/sigil/pr696-698-plural-sheaf-projection.ts \
            projections/SYNTHGOTHHUB_PR696_698_PLURAL_SHEAF_PROJECTION_V1.sigil
