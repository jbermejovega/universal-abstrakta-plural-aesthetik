name: SynthGothHub Coherent Aesthetik Projection

on:
  pull_request:
    paths:
      - ".github/workflows/synthgothhub-coherent-aesthetik-projection.yml"
      - "src/sigil/synthgothhub-coherent-fixed-point.ts"
      - "tests/synthgothhub-coherent-fixed-point.test.ts"
      - "projections/SYNTHGOTHHUB_UNIVERSAL_AESTHETIK_PROJECTION_V1.sigil"
      - "docs/SYNTHGOTHHUB_COHERENT_AESTHETIK_PROJECTION_V1.md"

permissions:
  contents: read

concurrency:
  group: synthgothhub-coherent-aesthetik-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run focused Vitest projection suite
        run: npx vitest run tests/synthgothhub-coherent-fixed-point.test.ts

      - name: Verify exact terminal end line
        run: |
          PROJECTION=projections/SYNTHGOTHHUB_UNIVERSAL_AESTHETIK_PROJECTION_V1.sigil
          tail -n 1 "$PROJECTION" | grep -Fx \
            'end SYNTHGOTHHUB_UNIVERSAL_AESTHETIK_PROJECTION_V1'
          test "$(grep -Fxc 'end SYNTHGOTHHUB_UNIVERSAL_AESTHETIK_PROJECTION_V1' "$PROJECTION")" = 1

      - name: Enforce inert rendering boundary
        run: |
          ! grep -REn \
            'git push|gh pr merge|workflow_dispatch:|child_process|exec\(|eval\(' \
            src/sigil/synthgothhub-coherent-fixed-point.ts \
            projections/SYNTHGOTHHUB_UNIVERSAL_AESTHETIK_PROJECTION_V1.sigil
